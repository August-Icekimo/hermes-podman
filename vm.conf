# ---------------------------------------------------------------------------
# Hermes VM — 佈署參數
# 這個檔案會被 vm/*.sh 直接 source，語法就是 bash 變數指派。
# 不要放機密：LINE 憑證留在 .env（已被 .gitignore 排除）。
# ---------------------------------------------------------------------------

# --- 身分 ------------------------------------------------------------------
VM_NAME="hermes"
VM_HOSTNAME="hermes"
VM_USER="hermes"              # VM 內的主要使用者，Hermes 以此身分執行

# --- 資源 ------------------------------------------------------------------
# 依本機實測（Ryzen 7 5825U / 8C16T、62G RAM、/datapool 682G 可用）而定。
VM_VCPUS="4"
VM_RAM_MB="8192"              # 若要跑 browser/playwright 類 skill 建議 16384
VM_DISK_GB="64"               # qcow2 精簡配置，不會立刻佔滿

# --- libvirt ---------------------------------------------------------------
LIBVIRT_URI="qemu:///system"
VM_POOL="default"                 # libvirt storage pool 名稱（→ /datapool/libvirt）
                                  # 磁碟一律透過 libvirtd 建立，所以整套腳本不需要 sudo
VM_NETWORK="host-bridge"          # 已存在的橋接網路（br0 → LAN 192.168.68.0/22）

# --- 基礎映像 --------------------------------------------------------------
# Debian 13 trixie：與 Hermes 官方 image 的底層一致（Debian 13 / Python 3.13）
CLOUD_IMAGE_URL="https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
CLOUD_IMAGE_SUMS_URL="https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS"

# --- UEFI 韌體 -------------------------------------------------------------
# Debian 13 cloud image 只能 UEFI 開機（BIOS 下會 GRUB 無限迴圈）。
# 用非 secure-boot 版本：Debian 不需要 SB，少一個 smm 相依。
OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"

# --- SSH -------------------------------------------------------------------
# 留空 = 自動偵測，優先讀 ~/.ssh/authorized_keys（可含多把，註解行會被濾掉），
# 其次是 ~/.ssh/id_*.pub，最後才從私鑰推導。指定路徑可覆寫。
SSH_PUBKEY_FILE=""

# --- 時區 ------------------------------------------------------------------
# VM 內的系統時區（會影響 journald/systemd timer 的時間戳，以及 agent 看到的
# 「現在幾點」）。留空 = 沿用 cloud image 的預設值 UTC。
VM_TIMEZONE="Asia/Taipei"

# --- Hermes 安裝 -----------------------------------------------------------
# 官方安裝腳本的參數。--skip-setup 讓設定精靈不要卡住無人值守安裝；
# 首次開機後再自己跑 `hermes setup`，或直接沿用 migrate-data.sh 帶進去的 config.yaml。
HERMES_INSTALL_ARGS="--non-interactive --skip-setup"

# 對外服務埠（僅供文件與防火牆腳本參考，實際由 Hermes 設定決定）
HERMES_GATEWAY_PORT="8642"
HERMES_LINE_PORT="8646"
HERMES_DASHBOARD_PORT="9119"
